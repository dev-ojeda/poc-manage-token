{% extends 'layout.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="my-5 d-flex justify-content-center">
    <div class="card col-md-4">
        <div class="card-header bg-body-secondary"></div>
        <div class="card-body">
            <h4 class="card-title">LOGIN</h4>
            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <input type="text" class="form-control" id="username" name="username" required autocomplete="username">
                    <div class="invalid-feedback">Por favor ingresa tu usuario.</div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                    <div class="invalid-feedback">Por favor ingresa tu contraseña.</div>
                </div>
                <button id="loginBtn" type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
        </div>
        <div class="card-footer bg-body-secondary"></div>
    </div>
</section>
{% endblock %}
