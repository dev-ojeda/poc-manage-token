{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block css %}
<link rel="stylesheet" href="{{ url_for('frontend.static', filename='css/dashboard.css') }}">
{% endblock %}
{% block content %}

<!-- Contenedor principal del dashboard -->
<div id="dashboardContent" class="dashboard-container fade-in" hidden>
    <!-- contenedor para mensajes -->
    <div id="alertContainer"></div>
    {% include 'dashboard/admin/dashboard_partial.html' %}
</div>
<!-- Cargador elegante mientras se renderiza el contenido -->
<div id="loadingSpinner" class="d-flex justify-content-center align-items-center vh-100">
    <div class="spinner-border text-primary" style="width: 4rem; height: 4rem;" role="status">
        <span class="visually-hidden">Cargando...</span>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.4.0"></script>
<script type="module" src="{{ url_for('frontend.static', filename='js/roles/AdminDashboard.js') }}"></script>
{% endblock %}
