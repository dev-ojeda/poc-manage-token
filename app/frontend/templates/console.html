<div id="debugConsole" class="debug-console hidden">
    <div class="debug-header">
        <span>🧠 Debug Console</span>
        <button id="clearDebug" class="btn btn-sm btn-outline-light ms-auto">Limpiar</button>
    </div>
    <div id="debugOutput" class="debug-output"></div>
</div>

<div id="debugToggleContainer" class="position-fixed bottom-0 end-0 m-3 p-2 bg-dark text-white rounded shadow-lg" style="z-index: 2000;">
    <div class="form-check form-switch mb-0">
        <input class="form-check-input" type="checkbox" id="debugToggle">
        <label class="form-check-label" for="debugToggle">🪲 Debug Mode</label>
    </div>
</div>
