{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block css %}
<link rel="preload" href="{{ url_for('frontend.static', filename='css/login.css') }}" as="style" onload="this.rel='stylesheet'">
<noscript>
    <link rel="stylesheet" href="{{ url_for('frontend.static', filename='css/login.css') }}">
</noscript>
{% endblock %}

{% block content %}
<div id="login-container" class="login-wrapper">
    <div class="login-card">
        <div id="alertContainer"></div>
        <h2 class="login-title">Iniciar Sesión</h2>
        <form id="loginForm" class="login-form">
            <div class="input-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required autocomplete="on">
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button id="loginBtn" type="submit" class="btn-login">
                <span class="btn-text">Acceder</span>
                <span class="loader"></span>
            </button>

            <div id="loginStatusMsg" class="login-status"></div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('frontend.static', filename='js/AuthApp.js') }}"></script>
{% endblock %}
