{% extends "/auth/base.html" %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<div class="card text-light text-center shadow-lg">
    <h4 class="mb-3 fw-semibold">🔐 WebAuthn Login</h4>
    <p class="text-secondary small">Inicio de sesión sin contraseñas, autenticación FIDO2</p>

    <form id="login-form" class="text-start mt-4">
        <div class="mb-3">
            <label for="username" class="form-label">Usuario</label>
            <input type="text" id="username" class="form-control bg-dark border-secondary text-light" autocomplete="username" required>
        </div>
        <div class="d-flex gap-2 mt-4">
            <button type="submit" id="btn-login" class="btn btn-primary w-100">Iniciar sesión</button>
        </div>
    </form>
    <div id="status" class="text-info small mt-3 text-center"></div>
</div>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('frontend.static', filename='js/login.js') }}"></script>
{% endblock %}
