{% extends "/auth/base.html" %}

{% block title %}Registrar usuario{% endblock %}

{% block content %}
<div class="card text-light text-center shadow-lg">
    <h4 class="mb-3 fw-semibold">📝 Registro WebAuthn</h4>
    <p class="text-secondary small">Crea un usuario y registra tu autenticador</p>

    <form id="register-form" class="text-start mt-4">
        <div class="mb-3">
            <label for="username" class="form-label">Usuario</label>
            <input type="text" id="username" class="form-control bg-dark border-secondary text-light" autocomplete="username" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Contraseña (solo primera vez)</label>
            <input type="password" id="password" class="form-control bg-dark border-secondary text-light" autocomplete="new-password" required>
        </div>
        <div class="d-flex gap-2 mt-4">
            <button type="submit" id="btn-register" class="btn btn-outline-light w-100">Registrar</button>
        </div>
    </form>
    <div id="status" class="text-info small mt-3 text-center"></div>
</div>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('frontend.static', filename='js/register.js') }}"></script>
{% endblock %}
